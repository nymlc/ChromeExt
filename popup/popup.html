<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>极客百宝箱</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-wrapper" id="appWrapper">
    <!-- 主页视图 -->
    <div class="view-home" id="viewHome">
      <div class="container">
        <div class="home-header">
          <h1>极客百宝箱</h1>
          <div class="header-actions">
            <div class="gear-menu-wrapper" id="gearMenuWrapper">
              <button class="gear-btn" id="gearBtn" title="全局设置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
                  </path>
                </svg>
              </button>
              <div class="gear-dropdown" id="gearDropdown">
                <div class="gear-dropdown-item">
                  <span>扩展状态</span>
                  <button id="globalToggle" class="btn btn-small btn-primary">已启用</button>
                </div>
                <div class="gear-dropdown-divider"></div>
                <div class="gear-dropdown-item">
                  <span>数据管理</span>
                  <div style="display: flex; gap: 6px;">
                    <button id="exportDataBtn" class="btn btn-small btn-secondary">导出</button>
                    <button id="importDataBtn" class="btn btn-small btn-secondary">导入</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 模块区域（可滚动、可拖拽排序） -->
        <div class="modules-container" id="modulesContainer">
          <!-- 已隐藏模块入口（默认隐藏，有隐藏模块时出现） -->
          <div class="hidden-modules-entry" id="hiddenModulesEntry" style="display:none;">
            <span>已隐藏 <span class="hidden-count">0</span> 个模块</span>
            <span class="enter-icon">›</span>
          </div>

          <!-- 密码显示功能区域 -->
          <div class="feature-module clickable-module" data-module-id="password" draggable="true"
            id="passwordModuleEntry">
            <div class="module-header" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
              <div class="module-header-left">
                <span class="drag-handle" title="拖拽排序">⠿</span>
                <h2>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: #007aff; margin-right: 6px;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                  </svg>
                  密码显示
                </h2>
              </div>
              <div class="module-header-right">
                <span class="enter-icon">›</span>
                <label class="switch" onclick="event.stopPropagation()">
                  <input type="checkbox" id="passwordModuleEnabled" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- 凭证管理功能区域 -->
          <div class="feature-module clickable-module" data-module-id="credential" draggable="true"
            id="credentialModuleEntry">
            <div class="module-header" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
              <div class="module-header-left">
                <span class="drag-handle" title="拖拽排序">⠿</span>
                <h2>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: #ff9500; margin-right: 6px;">
                    <path
                      d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4">
                    </path>
                  </svg>
                  凭证管理
                </h2>
              </div>
              <div class="module-header-right">
                <span class="enter-icon">›</span>
                <label class="switch" onclick="event.stopPropagation()">
                  <input type="checkbox" id="credentialModuleEnabled" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- MasterGo 导航模块 -->
          <div class="feature-module clickable-module" data-module-id="masterGoNav" draggable="true"
            id="masterGoNavModuleEntry">
            <div class="module-header" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
              <div class="module-header-left">
                <span class="drag-handle" title="拖拽排序">⠿</span>
                <h2>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: #5856d6; margin-right: 6px;">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                  </svg>
                  MasterGo 导航
                </h2>
              </div>
              <div class="module-header-right">
                <span class="enter-icon">›</span>
                <label class="switch" onclick="event.stopPropagation()">
                  <input type="checkbox" id="masterGoNavModuleEnabled" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- 时间戳格式化模块 -->
          <div class="feature-module clickable-module" data-module-id="timestampFormatter" draggable="true"
            id="timestampFormatterModuleEntry">
            <div class="module-header" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
              <div class="module-header-left">
                <span class="drag-handle" title="拖拽排序">⠿</span>
                <h2>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" style="color: #34c759; margin-right: 6px;">
                    <circle cx="12" cy="12" r="9"></circle>
                    <path d="M12 7v5l3 3"></path>
                  </svg>
                  时间戳格式化
                </h2>
              </div>
              <div class="module-header-right">
                <span class="enter-icon">›</span>
                <label class="switch" onclick="event.stopPropagation()">
                  <input type="checkbox" id="timestampFormatterModuleEnabled" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>

          <!-- 二维码工具模块 -->
          <div class="feature-module clickable-module" data-module-id="qrCodeTool" draggable="true"
            id="qrCodeToolModuleEntry">
            <div class="module-header" style="margin-bottom: 0; border-bottom: none; padding-bottom: 0;">
              <div class="module-header-left">
                <span class="drag-handle" title="拖拽排序">⠿</span>
                <h2>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #ff2d55; margin-right: 6px;">
                    <!-- 三个定位角（finder patterns） -->
                    <path d="M3 3h6v6H3z"></path>
                    <path d="M15 3h6v6h-6z"></path>
                    <path d="M3 15h6v6H3z"></path>
                    <!-- 定位角内点（填充） -->
                    <path d="M5 5h2v2H5z M17 5h2v2h-2z M5 17h2v2H5z" fill="currentColor" stroke="none"></path>
                    <!-- 数据模块（右下区域） -->
                    <path d="M15 15h3v3h-3z M19 15h1.5v2H19z M15 19h2v1.5H15z M19 19h1.5v1.5H19z M11 11h2v2h-2z"></path>
                  </svg>
                  二维码工具
                </h2>
              </div>
              <div class="module-header-right">
                <span class="enter-icon">›</span>
                <label class="switch" onclick="event.stopPropagation()">
                  <input type="checkbox" id="qrCodeToolModuleEnabled" checked>
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>
        </div>

        <div class="footer">
          <p class="version"></p>
        </div>
      </div>
    </div>

    <!-- 子页面视图 -->
    <div class="view-subpage" id="viewSubpage">
      <div class="subpage-header">
        <button id="subpageBackBtn" class="back-btn">
          <span style="font-size: 18px; margin-right: 4px; line-height: 1;">‹</span> 返回
        </button>
        <h2 id="subpageTitle">标题</h2>
        <div style="width: 50px;"></div> <!-- 占位符以居中标题 -->
      </div>
      <div class="subpage-content" id="credentialModuleContent">
        <!-- 由 CredentialManager.js 动态渲染 -->
      </div>
      <div class="subpage-content" id="masterGoNavModuleContent" style="display:none;">
        <!-- 由 MasterGoManager.js 动态渲染 -->
      </div>

      <!-- 以下为从卡片迁移进来的模块内容（id 保持不变，模块 JS 按 id 引用） -->
      <div class="subpage-content" id="passwordModuleContent" style="display:none;">
        <div class="setting-item">
          <button id="togglePassword" class="btn btn-primary btn-block">
            <span id="toggleText">显示所有密码</span>
          </button>
        </div>
        <p class="hint">双击密码框或点击眼睛图标可单独切换</p>
      </div>

      <div class="subpage-content" id="timestampFormatterModuleContent" style="display:none;">
        <div class="setting-item">
          <span>显示 UTC 时间</span>
          <label class="switch"><input type="checkbox" id="tsfShowUTC" checked><span class="slider"></span></label>
        </div>
        <div class="setting-item">
          <span>显示相对时间</span>
          <label class="switch"><input type="checkbox" id="tsfShowRelative" checked><span class="slider"></span></label>
        </div>
        <p class="hint">在网页中选中/复制数字时间戳自动弹出浮层；在其它应用复制的时间戳，回到网页或输入框粘贴即可自动识别解析。</p>
      </div>

      <div class="subpage-content" id="qrCodeToolModuleContent" style="display:none;">
        <div class="setting-item" style="flex-direction:column; align-items:stretch; gap:8px;">
          <div style="font-weight:600;">生成二维码</div>
          <textarea id="qrcodeGenInput" placeholder="输入文本或网址…" rows="3" style="width:100%; resize:vertical; border:1px solid #e0e0e0; border-radius:8px; padding:8px; font-size:13px; font-family:inherit; box-sizing:border-box;"></textarea>
          <div id="qrcodeGenStatus" style="display:none; color:#ff9500; font-size:12px;"></div>
          <canvas id="qrcodeGenCanvas" style="display:none; margin:4px auto 0; background:#fff; border:1px solid #e0e0e0; border-radius:8px; padding:4px; max-width:100%;"></canvas>
          <button id="qrcodeGenDownload" class="btn btn-secondary btn-small" style="align-self:flex-start;">下载 PNG</button>
        </div>
        <div class="setting-item" style="flex-direction:column; align-items:stretch; gap:8px; margin-top:14px;">
          <div style="font-weight:600;">解码二维码（上传 / 粘贴图片）</div>
          <label class="btn btn-primary btn-small" style="align-self:flex-start; cursor:pointer;">
            选择图片
            <input id="qrcodeDecodeFile" type="file" accept="image/*" style="display:none;">
          </label>
          <div id="qrcodeDecodeStatus" style="display:none; color:#ff9500; font-size:12px;"></div>
          <div id="qrcodeDecodeResult" style="display:none; margin-top:4px; padding:10px; border:1px solid #e0e0e0; border-radius:8px; background:#fafafa; font-size:13px; white-space:pre-wrap; word-break:break-all;"></div>
          <button id="qrcodeDecodeCopy" class="btn btn-secondary btn-small" style="align-self:flex-start;">复制结果</button>
        </div>
      </div>

      <!-- 隐藏模块管理面板 -->
      <div class="subpage-content" id="hiddenModulesModuleContent" style="display:none;"></div>
    </div>
  </div>

  <script src="../shared/Toast.js"></script>
  <script src="../lib/qrcode.min.js"></script>
  <script src="../lib/jsqr.min.js"></script>
  <script src="modules/BaseModule.js"></script>
  <script src="modules/PasswordToggle.js"></script>
  <script src="modules/CredentialManager.js"></script>
  <script src="modules/MasterGoManager.js"></script>
  <script src="modules/TimestampFormatter.js"></script>
  <script src="modules/QrCodeTool.js"></script>
  <script src="popup.js"></script>
</body>

</html>
